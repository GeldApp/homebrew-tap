name: Update GeldApp cask

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-geldapp-cask
  cancel-in-progress: false

jobs:
  update:
    name: Open verified cask update
    runs-on: macos-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the latest stable app release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api 'repos/GeldApp/GeldApp/releases?per_page=100' \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0] // empty' \
            > "$RUNNER_TEMP/release.json"
          if [ ! -s "$RUNNER_TEMP/release.json" ]; then
            echo "No public stable app release exists yet; the tap stays empty."
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"

      - name: Read and verify the DMG checksum
        if: ${{ steps.release.outputs.available == 'true' }}
        run: |
          python3 scripts/prepare_release.py "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-asset.json"
          checksum_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checksum_url"])' "$RUNNER_TEMP/release-asset.json")"
          curl --fail --location --silent --show-error "$checksum_url" --output "$RUNNER_TEMP/release.sha256"

      - name: Write the exact-version cask
        if: ${{ steps.release.outputs.available == 'true' }}
        run: python3 scripts/write_cask.py "$RUNNER_TEMP/release-asset.json" "$RUNNER_TEMP/release.sha256" Casks/geldapp.rb

      - name: Create or update the cask pull request
        id: cask-pr
        if: ${{ steps.release.outputs.available == 'true' }}
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/geldapp-cask
          delete-branch: true
          commit-message: 'chore(cask): update GeldApp Homebrew distribution'
          title: 'chore(cask): update GeldApp cask'
          body: |
            Update the GeldApp cask from its latest published stable release.

            The versioned release URL and SHA-256 were read from the public release and checksum asset.
          add-paths: Casks/geldapp.rb

      - name: Dispatch cask checks on the PR branch
        if: ${{ steps.cask-pr.outputs.pull-request-branch != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.cask-pr.outputs.pull-request-branch }}
        run: gh workflow run checks.yml --ref "$PR_BRANCH"

      - name: Enable squash auto-merge after required checks
        if: ${{ steps.cask-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cask-pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
